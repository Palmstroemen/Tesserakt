# Testbetrieb ueber Tailscale Funnel: nur das Backend, ohne Caddy. Funnel stellt HTTPS unter
# https://<rechner>.<tailnet>.ts.net bereit (die Verschluesselung endet auf diesem Rechner) und leitet an
# 127.0.0.1:<TESSERAKT_PORT> weiter (Standard 8000). Anleitung: docs/betrieb.md, Abschnitt "Testbetrieb mit Tailscale Funnel".
# In server/.env: COMPOSE_FILE=docker-compose.funnel.yml, dann gelten docker compose und sicherung.sh dafuer.

services:
  backend:
    extends:
      file: docker-compose.yml
      service: backend
    ports:
      - "127.0.0.1:${TESSERAKT_PORT:-8000}:8000" # nur fuer Funnel auf diesem Rechner, nicht im Heimnetz

volumes:
  daten:
